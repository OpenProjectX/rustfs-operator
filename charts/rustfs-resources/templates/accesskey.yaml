{{- $seen := dict }}
{{- range .Values.accessKeys }}
{{- $name := include "rustfs-resources.entryName" (dict "entry" . "seen" $seen "kind" "accessKeys") }}
{{- $id := printf "accessKeys[%s]" $name }}
{{- $user := .user | default "" }}
{{- if eq $user "" }}
{{- fail (printf "%s: 'user' (the owning RustFS username) is required" $id) }}
{{- end }}
{{- if or (hasKey . "passwordFromUser") (hasKey . "passwordRef") }}
{{- fail (printf "%s: passwordFromUser/passwordRef were removed in chart 0.7.0. The operator now issues keys with its own admin credential using targetUser, so the owning user's password is no longer needed. Drop the field, and drop the admin:CreateServiceAccount / ListServiceAccounts / RemoveServiceAccount grants from that user's policy if nothing else needs them" $id) }}
{{- end }}
{{- $ak := .accessKey | default "" }}
{{- if and (ne $ak "") (eq $ak $user) }}
{{- fail (printf "%s: accessKey %q must differ from the owning username; in RustFS a user is itself an access key, so reusing the name collides and the server rejects the lookup. Pick another name or omit accessKey to have one generated" $id $ak) }}
{{- end }}
---
apiVersion: rustfs.com/v1alpha1
kind: AccessKey
metadata:
  name: {{ $name }}
  labels:
    {{- include "rustfs-resources.labels" $ | nindent 4 }}
spec:
  {{- include "rustfs-resources.connection" (dict "root" $ "entry" . "id" $id) | nindent 2 }}
  user: {{ $user | quote }}
  {{- with .accessKey }}
  accessKey: {{ . | quote }}
  {{- end }}
  {{- with .description }}
  description: {{ . | quote }}
  {{- end }}
  {{- with .policy }}
  policy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .targetSecretName }}
  targetSecretName: {{ . | quote }}
  {{- end }}
  {{- include "rustfs-resources.deletionPolicy" (dict "entry" . "id" $id) | nindent 2 }}
{{- end }}
